name: Update download stats

on:
  schedule:
    # Upstream commits its stats between 00:23 and 00:27 UTC, and scheduled runs on GitHub
    # are often delayed under load. 03:00 leaves room for both.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Required since 2023: new repositories give GITHUB_TOKEN read-only access by default,
# and committing the refreshed SVGs needs write.
permissions:
  contents: write

concurrency:
  group: obsidian-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate badge and chart
        uses: yut0takagi/obsidian-plugin-stats-badge@v1
        with:
          plugin-id: |
            deck-dashboard
            pptx-studio
            meeting-detector
            system-recording
            share-hosted
            flint-chart
          chart-title: yut0takagi — Obsidian plugins
          csv: 'true'

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain .github/stats)" ]; then
            echo "No change in download stats."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/stats
          # [skip ci] keeps the daily data commit from starting other workflows.
          git commit -m 'chore: update Obsidian download stats [skip ci]'
          git push

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  bundle-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run bundle
      # A Node action runs dist/, not src/. A stale bundle would ship old behaviour
      # while the source looks correct.
      - name: Fail if dist/ is out of date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo 'dist/ is out of date. Run "npm run bundle" and commit the result.'
            git --no-pager diff --stat dist
            exit 1
          fi
